<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{page_title}}</title>
  <meta property="og:title" content="{{page_title}}">
  <meta property="og:type" content="website">
  <link rel="canonical" href="https://noblesourdough.com/{{id}}">
  <!-- build:head -->
  <!-- /build:head -->
</head>
<body style="--loaf: {{color_loaf}}; --ingredient-columns: {{ingredient_columns}}">
  <!-- build:header sourdough -->
  <!-- /build:header -->

  <main class="loaf-page wrap">
    <div class="loaf-top">
      <a class="circle-btn" href="/sourdough" aria-label="Back to the Sourdough range"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></a>
      <ul class="loaf-summary" aria-hidden="true"><li>Sourdough</li>{{spec_lines}}<li>{{allergen_list}}</li></ul>
    </div>
    <div class="loaf-hero">
      <div class="loaf-photo-frame" data-reveal="mask">
        <img class="loaf-photo" src="/assets/img/loaves/{{id}}.webp" alt="{{page_title}} in its Noble Sourdough bag, beside a whole baked loaf" width="1200" height="1200" style="view-transition-name: loaf-{{id}}">
      </div>
      <div class="loaf-info">
        <h1 data-split>{{heading}}</h1>
        <p class="loaf-desc" data-reveal="fade">{{description}}</p>
        <div class="facts" data-reveal="fade" style="--i: 2">
          <div class="ingredients">
            <h2>INGREDIENTS</h2>
            <ul>
{{ingredients}}
            </ul>
          </div>
          <div>
            <h2>ALLERGENS</h2>
            <ul class="tags">{{allergens}}</ul>
          </div>
          <div>
            <h2>SPECS</h2>
            <ul>
{{specs}}
            </ul>
          </div>
        </div>
      </div>
    </div>

    <figure class="nutrition" data-reveal="fade">
      <img src="/assets/img/loaves/{{id}}-panel.webp" alt="Nutrition facts table for {{page_title}}" width="1400" height="445" loading="lazy">
    </figure>

    <section class="more" aria-label="The Sourdough range">
      <a class="link-arrow" href="/sourdough"><span>The SOURDOUGH Range</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></a>
      <div class="more-grid">
{{more}}
      </div>
    </section>
  </main>

  <!-- build:footer -->
  <!-- /build:footer -->
</body>
</html>
